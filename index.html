<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Web Editor Pro</title>

<!-- =====================================================
     CodeMirror
===================================================== -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

<!-- إغلاق الوسوم والأقواس تلقائياً -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>


<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
* { font-family: "Tajawal", Arial, sans-serif; }
.CodeMirror, .CodeMirror textarea, .CodeMirror pre { font-family: "Tajawal", monospace !important; }

/* =====================================================
   GLOBAL
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #001D3D;
    color: white;
    font-family: "Tajawal", Arial, sans-serif;
    overflow: hidden;
}


/* =====================================================
   HEADER
===================================================== */

header {
    height: 60px;
    background: linear-gradient(110deg, #002855 0%, #003b70 58%, #005078 100%);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    box-shadow: 0 5px 24px rgba(0,0,0,.28);
    border-bottom: 1px solid rgba(70, 210, 255, .18);

    position: relative;
    z-index: 20;
}

.logo {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -.3px;
    white-space: nowrap;
    color: #f4f9ff;
}

.logo span {
    color: #25c7f4;
    font-weight: 700;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

button {
    font-family: "Tajawal", Arial, sans-serif;
    border: none;
    border-radius: 7px;

    padding: 9px 13px;

    cursor: pointer;

    font-weight: bold;
    font-size: 14px;

    transition: .2s;
}

button:hover {
    transform: translateY(-1px);
    filter: brightness(1.1);
}

button:active {
    transform: scale(.97);
}

.run {
    background: #00b4d8;
    color: white;
}

.save {
    background: #38b000;
    color: white;
}

.download {
    background: #fca311;
    color: black;
}

.clear {
    background: #d90429;
    color: white;
}

/* =====================================================
   TABS
===================================================== */

.tabs {
    height: 48px;

    background: linear-gradient(90deg, #001529, #052644);

    display: flex;
    align-items: center;

    padding-right: 10px;

    gap: 4px;

    overflow-x: auto;
}

.tab {
    padding: 12px 22px;

    cursor: pointer;

    border-radius: 6px 6px 0 0;

    color: #a9bfd4;

    white-space: nowrap;

    transition: .22s ease;
    font-family: "Tajawal", Arial, sans-serif;
    font-weight: 700;
}

.tab:hover {
    color: white;
}

.tab.active {
    background: linear-gradient(180deg, #29344a, #202b40);

    color: white;

    border-bottom: 3px solid #25c7f4;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
}


/* =====================================================
   MAIN EDITOR
===================================================== */

.editor-container {
    height: calc(100vh - 108px);

    display: grid;

    grid-template-columns: 50% 50%;

    min-height: 0;
}


/* =====================================================
   CODE AREA
===================================================== */

.code-area {
    direction: ltr;

    height: 100%;

    min-height: 0;

    background: #282a36;

    overflow: hidden;
}

.code-area textarea {
    display: none;
}

.CodeMirror {
    height: 100%;

    font-size: 15px;

    direction: ltr;

    text-align: left;

    font-family:
        Consolas,
        "Courier New",
        monospace;
}


/* =====================================================
   PREVIEW
===================================================== */

.preview-area {
    background: white;

    position: relative;

    height: 100%;

    min-height: 0;

    border-right: 2px solid #003566;

    overflow: hidden;
}

.preview-title {
    position: absolute;

    top: 0;
    right: 0;
    left: 0;

    height: 35px;

    background: linear-gradient(90deg, #003566, #00558c);

    color: white;
    font-family: "Tajawal", Arial, sans-serif;

    display: flex;

    align-items: center;

    padding-right: 15px;

    z-index: 5;

    font-weight: bold;
}

.preview-frame {
    position: absolute;

    top: 35px;
    right: 0;
    bottom: 0;
    left: 0;

    background: white;
}

iframe {
    width: 100%;
    height: 100%;

    display: block;

    border: none;

    background: white;
}


/* =====================================================
   STATUS
===================================================== */

.status {
    position: fixed;

    bottom: 12px;
    left: 12px;

    background: rgba(0,0,0,.75);

    color: white;

    padding: 7px 12px;

    border-radius: 6px;

    font-size: 13px;
    font-family: "Tajawal", Arial, sans-serif;
    box-shadow: 0 8px 28px rgba(0,0,0,.28);
    border: 1px solid rgba(255,255,255,.12);

    opacity: 0;

    pointer-events: none;

    transition: .3s;

    z-index: 100;
}

.status.show {
    opacity: 1;
}


/* =====================================================
   FULLSCREEN
===================================================== */




/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px) {

    body {
        overflow: auto;
    }

    header {
        height: auto;

        min-height: 60px;

        flex-direction: column;

        gap: 10px;

        padding: 10px;
    }

    .toolbar {
        justify-content: center;
    }

    .tabs {
        height: 48px;

        overflow-x: auto;

        direction: rtl;
    }

    .editor-container {

        height: calc(100vh - 155px);

        min-height: 500px;

        grid-template-columns: 1fr;

        grid-template-rows: 50% 50%;
    }

    .preview-area {

        border-right: none;

        border-top: 2px solid #003566;
    }

    .CodeMirror {
        font-size: 14px;
    }

    .logo {
        font-size: 18px;
    }

    button {
        padding: 8px 10px;

        font-size: 13px;
    }

}


/* =====================================================
   VERY SMALL SCREENS
===================================================== */

@media(max-width:480px) {

    .toolbar {
        gap: 4px;
    }

    button {
        padding: 7px 8px;
        font-size: 12px;
    }

    .tab {
        padding: 11px 15px;
    }

}


/* =====================================================
   CUSTOM MODALS
===================================================== */
.modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 10, 25, .72);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .22s ease, visibility .22s ease;
}
.modal-overlay.open {
    opacity: 1;
    visibility: visible;
}
.modal-card {
    width: min(100%, 420px);
    overflow: hidden;
    color: #f5f8ff;
    background: linear-gradient(145deg, #102d4d, #071a30);
    border: 1px solid rgba(0, 180, 216, .35);
    border-radius: 20px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, .48), 0 0 35px rgba(0, 180, 216, .10);
    transform: translateY(14px) scale(.97);
    transition: transform .22s ease;
    direction: rtl;
    font-family: Arial, sans-serif;
}
.modal-overlay.open .modal-card {
    transform: translateY(0) scale(1);
}
.modal-head {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 22px 22px 14px;
}
.modal-icon {
    display: grid;
    place-items: center;
    flex: 0 0 46px;
    width: 46px;
    height: 46px;
    border-radius: 15px;
    color: #fff;
    background: linear-gradient(135deg, #00b4d8, #2878ff);
    font-size: 23px;
    box-shadow: 0 7px 22px rgba(0, 180, 216, .22);
}
.modal-card.warning .modal-icon {
    background: linear-gradient(135deg, #ff9f1c, #f05d23);
}
.modal-title {
    margin: 0;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.4;
}
.modal-message {
    margin: 0;
    padding: 0 22px 22px;
    color: #c5d3e4;
    font-size: 14px;
    line-height: 1.9;
    white-space: pre-line;
}
.modal-actions {
    display: flex;
    gap: 10px;
    padding: 15px 22px 22px;
    border-top: 1px solid rgba(255,255,255,.08);
}
.modal-actions button {
    flex: 1;
    min-height: 43px;
    border-radius: 11px;
    font-size: 14px;
}
.modal-confirm {
    color: #fff;
    background: linear-gradient(135deg, #00a8cc, #2475f5);
}
.modal-cancel {
    color: #dce8f5;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.1);
}
.modal-close {
    margin-right: auto;
    align-self: flex-start;
    padding: 4px 9px;
    color: #a9bed3;
    background: transparent;
    font-size: 20px;
}
.modal-close:hover { color: #fff; }
@media (prefers-reduced-motion: reduce) {
    .modal-overlay, .modal-card { transition: none; }
}


/* الهوية البصرية لمكتبة عامودا */
:root { color-scheme: dark; --accent: #25c7f4; --accent-2: #2684ff; }
::selection { background: rgba(37,199,244,.28); }
header .logo { text-shadow: 0 2px 14px rgba(0,0,0,.18); }
.toolbar button { border: 1px solid rgba(255,255,255,.10); }
.toolbar .run { background: linear-gradient(135deg, #08b6d9, #087fbd); }
.toolbar .save { background: linear-gradient(135deg, #43c879, #188c62); }
.toolbar .download { background: linear-gradient(135deg, #ffc45c, #f39a24); }
.toolbar .clear { background: linear-gradient(135deg, #ff5367, #c9183d); }
.code-area { box-shadow: inset -1px 0 0 rgba(255,255,255,.04); }
.preview-area { box-shadow: -8px 0 30px rgba(0,0,0,.12); }
.modal-card, .modal-message, .modal-title, .modal-actions button { font-family: "Tajawal", Arial, sans-serif; }
@media (max-width: 800px) {
    .logo { white-space: normal; text-align: center; line-height: 1.5; }
    header { background: linear-gradient(145deg, #002855, #00416d); }
}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

<div class="logo" aria-label="محرر الأكواد من مكتبة عامودا">
    محرر الأكواد من مكتبة <span>عامودا</span>
</div>


<div class="toolbar">

<button class="run" onclick="runCode()">
▶ تشغيل
</button>

<button class="save" onclick="saveProject()">
💾 حفظ
</button>

<button class="download" onclick="downloadHTML()">
📥 تحميل
</button>

<button class="clear" onclick="clearAll()">
🗑️ مسح
</button>

</div>

</header>



<!-- =====================================================
     TABS
===================================================== -->

<div class="tabs">

<div class="tab active"
     onclick="showEditor('html',this)">
HTML
</div>

<div class="tab"
     onclick="showEditor('css',this)">
CSS
</div>

<div class="tab"
     onclick="showEditor('js',this)">
JavaScript
</div>

</div>



<!-- =====================================================
     MAIN
===================================================== -->

<div class="editor-container">


<!-- CODE -->

<div class="code-area">

<textarea id="html"></textarea>

<textarea id="css"></textarea>

<textarea id="js"></textarea>

</div>


<!-- PREVIEW -->

<div class="preview-area">

<div class="preview-title">
    👁️ المعاينة
</div>

<div class="preview-frame">

<iframe
id="preview"
sandbox="allow-scripts allow-forms allow-modals allow-popups">
</iframe>

</div>

</div>

</div>




<!-- نافذة منبثقة مخصصة -->
<div id="customModal" class="modal-overlay" aria-hidden="true">
    <section class="modal-card" id="customModalCard" role="dialog" aria-modal="true"
             aria-labelledby="customModalTitle" aria-describedby="customModalMessage">
        <div class="modal-head">
            <div class="modal-icon" id="customModalIcon">✦</div>
            <h2 class="modal-title" id="customModalTitle">تنبيه</h2>
            <button class="modal-close" type="button" aria-label="إغلاق" onclick="closeCustomModal(false)">×</button>
        </div>
        <p class="modal-message" id="customModalMessage"></p>
        <div class="modal-actions" id="customModalActions"></div>
    </section>
</div>


<!-- STATUS -->

<div id="status"
class="status">
تم الحفظ
</div>



<script>

/* =====================================================
   DEFAULT HTML
===================================================== */

const defaultHTML = `
<div class="container">

    <h1>مرحبا بك 👋</h1>

    <p>
        هذا محرر HTML احترافي
    </p>

    <button onclick="hello()">
        اضغط هنا
    </button>

</div>
`;


/* =====================================================
   DEFAULT CSS
===================================================== */

const defaultCSS = `
body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px;
    background: #f5f5f5;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #ccc;
}

h1 {
    color: #0077b6;
}

button {
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    background: #0077b6;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #005f8a;
}
`;


/* =====================================================
   DEFAULT JAVASCRIPT
===================================================== */

const defaultJS = `
function hello() {
    if (document.getElementById("helloModal")) return;
    const box = document.createElement("div");
    box.id = "helloModal";
    box.innerHTML = '<div dir="rtl" style="position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:20px;background:rgba(4,16,35,.72);backdrop-filter:blur(7px);font-family:Arial,sans-serif">' +
      '<div style="width:min(100%,360px);padding:28px;border-radius:22px;background:linear-gradient(145deg,#fff,#edf7ff);color:#17324d;text-align:center;box-shadow:0 24px 70px #0005;border:1px solid #cce5f7">' +
      '<div style="width:58px;height:58px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#00b4d8,#2878ff);color:white;font-size:28px">✓</div>' +
      '<h2 style="margin:0 0 10px;font-size:22px">أهلاً بك!</h2>' +
      '<p style="margin:0 0 22px;line-height:1.9;color:#52677b">مرحباً بك في محرر الأكواد. يمكنك تعديل الأكواد ومعاينة النتيجة مباشرة.</p>' +
      '<button onclick="document.getElementById('helloModal').remove()" style="border:0;border-radius:11px;padding:12px 28px;background:linear-gradient(135deg,#00a8cc,#2475f5);color:#fff;font-size:15px;font-weight:bold;cursor:pointer">رائع، لنبدأ</button>' +
      '</div></div>';
    document.body.appendChild(box);
}
`;


/* =====================================================
   EDITORS
===================================================== */

const editors = {};


/* HTML */

editors.html = CodeMirror.fromTextArea(
    document.getElementById("html"),
    {
        mode: "xml",
        theme: "dracula",

        lineNumbers: true,

        lineWrapping: true,

        autoCloseTags: true,

        autoCloseBrackets: true,

        tabSize: 2,

        indentUnit: 2,

        indentWithTabs: false
    }
);


/* CSS */

editors.css = CodeMirror.fromTextArea(
    document.getElementById("css"),
    {
        mode: "css",
        theme: "dracula",

        lineNumbers: true,

        lineWrapping: true,

        autoCloseBrackets: true,

        tabSize: 2,

        indentUnit: 2,

        indentWithTabs: false
    }
);


/* JAVASCRIPT */

editors.js = CodeMirror.fromTextArea(
    document.getElementById("js"),
    {
        mode: "javascript",
        theme: "dracula",

        lineNumbers: true,

        lineWrapping: true,

        autoCloseBrackets: true,

        tabSize: 2,

        indentUnit: 2,

        indentWithTabs: false
    }
);


/* =====================================================
   DEFAULT CONTENT
===================================================== */

editors.html.setValue(defaultHTML.trim());

editors.css.setValue(defaultCSS.trim());

editors.js.setValue(defaultJS.trim());


/* =====================================================
   SHOW EDITOR
===================================================== */

function showEditor(type, element) {

    document
        .querySelectorAll(".tab")
        .forEach(tab => {

            tab.classList.remove("active");

        });


    element.classList.add("active");


    Object.keys(editors).forEach(key => {

        editors[key]
            .getWrapperElement()
            .style.display = "none";

    });


    editors[type]
        .getWrapperElement()
        .style.display = "block";


    editors[type].refresh();

}


/* =====================================================
   INITIAL EDITOR
===================================================== */

showEditor(
    "html",
    document.querySelector(".tab")
);


/* =====================================================
   BUILD HTML
===================================================== */

function buildDocument() {

    const html =
        editors.html.getValue();

    const css =
        editors.css.getValue();

    const js =
        editors.js.getValue();


    return `
<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<style>

${css}

</style>

</head>

<body>

${html}

<script>

${js}

<\/script>

</body>

</html>
`;

}


/* =====================================================
   RUN
===================================================== */

function runCode() {

    const documentCode =
        buildDocument();


    document
        .getElementById("preview")
        .srcdoc = documentCode;


    showStatus("تم تشغيل المشروع ▶");

}


/* =====================================================
   SAVE PROJECT
===================================================== */

function saveProject() {

    const project = {

        html:
            editors.html.getValue(),

        css:
            editors.css.getValue(),

        js:
            editors.js.getValue(),

        savedAt:
            new Date().toISOString()

    };


    try {

        localStorage.setItem(
            "webEditorProject",
            JSON.stringify(project)
        );


        localStorage.setItem(
            "webEditorAutoSave",
            JSON.stringify(project)
        );


        showStatus("تم حفظ المشروع بنجاح 💾");


    } catch(error) {

        openCustomModal({
            title: "تعذر حفظ المشروع",
            message: "لم يتمكن المتصفح من حفظ المشروع. تحقق من إعدادات التخزين أو المساحة المتاحة، ثم حاول مجددًا.",
            icon: "!",
            type: "warning",
            confirmText: "حسنًا",
            showCancel: false
        });

        console.error(error);

    }

}


/* =====================================================
   LOAD PROJECT
===================================================== */

function loadProject() {

    try {

        const saved =
            localStorage.getItem(
                "webEditorProject"
            );


        if (!saved) {

            return false;

        }


        const project =
            JSON.parse(saved);


        if (!project ||
            typeof project !== "object") {

            return false;

        }


        editors.html.setValue(
            project.html || ""
        );

        editors.css.setValue(
            project.css || ""
        );

        editors.js.setValue(
            project.js || ""
        );


        showStatus("تم استرجاع المشروع 💾");


        return true;


    } catch(error) {

        console.error(
            "خطأ أثناء تحميل المشروع:",
            error
        );


        return false;

    }

}


/* =====================================================
   AUTO SAVE
===================================================== */

function autoSave() {

    const project = {

        html:
            editors.html.getValue(),

        css:
            editors.css.getValue(),

        js:
            editors.js.getValue(),

        savedAt:
            new Date().toISOString()

    };


    try {

        localStorage.setItem(
            "webEditorAutoSave",
            JSON.stringify(project)
        );

    } catch(error) {

        console.error(
            "خطأ في الحفظ التلقائي:",
            error
        );

    }

}


/* حفظ تلقائي كل 5 ثوانٍ */

setInterval(
    autoSave,
    5000
);


/* =====================================================
   DOWNLOAD
===================================================== */

function downloadHTML() {

    const fullHTML =
        buildDocument();


    const blob =
        new Blob(
            [fullHTML],
            {
                type:
                    "text/html;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;

    a.download =
        "my-page.html";


    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);


    setTimeout(() => {

        URL.revokeObjectURL(url);

    }, 100);


    showStatus(
        "تم تحميل الصفحة 📥"
    );

}


/* =====================================================
   CLEAR
===================================================== */

function clearAll() {

    openCustomModal({
        title: "تأكيد مسح المشروع",
        message: "هل تريد مسح جميع الأكواد وبيانات الحفظ؟ لا يمكن التراجع عن هذه الخطوة.",
        icon: "⚠",
        type: "warning",
        confirmText: "نعم، امسح الكل",
        cancelText: "إلغاء",
        onConfirm: function () {
            performClearAll();
        }
    });
}

function performClearAll() {
    editors.html.setValue("");

    editors.css.setValue("");

    editors.js.setValue("");


    try {

        localStorage.removeItem(
            "webEditorProject"
        );

        localStorage.removeItem(
            "webEditorAutoSave"
        );

    } catch(error) {

        console.error(error);

    }


    runCode();

    showStatus(
        "تم مسح المشروع 🗑️"
    );

}



/* =====================================================
   CUSTOM MODAL CONTROLLER
===================================================== */
let customModalCallback = null;

function openCustomModal(options) {
    const overlay = document.getElementById("customModal");
    const card = document.getElementById("customModalCard");
    const actions = document.getElementById("customModalActions");
    const cancelText = options.cancelText || "إلغاء";
    const confirmText = options.confirmText || "حسنًا";

    document.getElementById("customModalTitle").textContent = options.title || "تنبيه";
    document.getElementById("customModalMessage").textContent = options.message || "";
    document.getElementById("customModalIcon").textContent = options.icon || "✦";
    card.classList.toggle("warning", options.type === "warning");
    actions.replaceChildren();
    customModalCallback = typeof options.onConfirm === "function" ? options.onConfirm : null;

    if (options.showCancel !== false) {
        const cancel = document.createElement("button");
        cancel.type = "button";
        cancel.className = "modal-cancel";
        cancel.textContent = cancelText;
        cancel.onclick = () => closeCustomModal(false);
        actions.appendChild(cancel);
    }

    const confirm = document.createElement("button");
    confirm.type = "button";
    confirm.className = "modal-confirm";
    confirm.textContent = confirmText;
    confirm.onclick = () => closeCustomModal(true);
    actions.appendChild(confirm);

    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    confirm.focus();
}

function closeCustomModal(confirmed) {
    const overlay = document.getElementById("customModal");
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    const callback = customModalCallback;
    customModalCallback = null;
    if (confirmed && callback) callback();
}

document.getElementById("customModal").addEventListener("click", function(event) {
    if (event.target === this) closeCustomModal(false);
});

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape" &&
        document.getElementById("customModal").classList.contains("open")) {
        closeCustomModal(false);
    }
});


/* =====================================================
   STATUS MESSAGE
===================================================== */

let statusTimer;


function showStatus(message) {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    status.classList.add(
        "show"
    );


    clearTimeout(statusTimer);


    statusTimer =
        setTimeout(() => {

            status.classList.remove(
                "show"
            );

        }, 2000);

}
