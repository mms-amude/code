<head>

content="width=device-width, initial-scale=1.0">

<title>محرر الأكواد من مكتبة عامودا الرقمية</title>

href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

<link rel="stylesheet"

<style>

/* =========================
   الأساس
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{

    --navy:#0b2239;
    --navy2:#123754;
    --navy3:#19496b;

    --gold:#c7a45b;
    --gold2:#e2ca91;

    --cream:#f6f2e9;
    --cream2:#eee8dc;

    --white:#ffffff;

    --success:#2d8a57;
    --danger:#b63b3b;

    --shadow:0 10px 30px rgba(0,0,0,.15);
}

body{

    font-family:"Tajawal",sans-serif;

    background:
        radial-gradient(
            circle at top right,
            rgba(199,164,91,.10),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            var(--cream),
            var(--cream2)
        );

    color:var(--navy);

    min-height:100vh;
}


/* =========================
   Header
========================= */

header{

    background:
        linear-gradient(
            135deg,
            var(--navy),
            var(--navy2)
        );

    color:white;

    padding:16px 25px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    box-shadow:var(--shadow);

    position:sticky;

    top:0;

    z-index:1000;
}

.logo{

    display:flex;

    align-items:center;

    gap:13px;
}

.logo-icon{

    width:52px;

    height:52px;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            var(--gold),
            var(--gold2)
        );

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:27px;

    box-shadow:
        0 5px 18px rgba(0,0,0,.25);
}

.logo-text h1{

    font-size:21px;

    font-weight:800;

    margin-bottom:2px;
}

.logo-text p{

    color:var(--gold2);

    font-size:12px;

    font-weight:500;
}


/* =========================
   Toolbar
========================= */

.toolbar{

    display:flex;

    align-items:center;

    justify-content:center;

    flex-wrap:wrap;

    gap:8px;

    padding:13px;

    background:white;

    border-bottom:1px solid rgba(0,0,0,.08);

    box-shadow:
        0 3px 12px rgba(0,0,0,.05);

    position:sticky;

    top:84px;

    z-index:900;
}

.tool-btn{

    border:none;

    border-radius:10px;

    padding:10px 16px;

    font-family:inherit;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:6px;
}

.tool-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 5px 12px rgba(0,0,0,.12);
}

.btn-run{

    background:var(--success);

    color:white;
}

.btn-save{

    background:var(--navy);

    color:white;
}

.btn-download{

    background:var(--gold);

    color:var(--navy);
}

.btn-clear{

    background:var(--danger);

    color:white;
}


/* =========================
   Main
========================= */

.main-container{

    width:100%;

    max-width:1600px;

    margin:auto;

    padding:18px;
}


/* =========================
   Tabs
========================= */

.editor-tabs{

    display:flex;

    gap:5px;

    background:var(--navy);

    padding:7px;

    border-radius:12px 12px 0 0;
}

.editor-tab{

    border:none;

    background:transparent;

    color:#cbd5df;

    font-family:inherit;

    font-weight:700;

    padding:11px 20px;

    border-radius:8px;

    cursor:pointer;

    transition:.2s;
}

.editor-tab:hover{

    color:white;

    background:
        rgba(255,255,255,.08);
}

.editor-tab.active{

    background:
        linear-gradient(
            135deg,
            var(--gold),
            var(--gold2)
        );

    color:var(--navy);
}


/* =========================
   Workspace
========================= */

.workspace{

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);

    gap:15px;

    margin-top:15px;
}


/* =========================
   Editor
========================= */

.editor-panel{

    background:#282a36;

    border-radius:12px;

    overflow:hidden;

    box-shadow:var(--shadow);

    min-width:0;
}

.editor-header{

    background:#20222c;

    color:white;

    padding:10px 15px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    font-size:13px;

    font-weight:700;
}

.editor-language{

    color:var(--gold2);

    font-size:12px;
}

.editor-wrapper{

    height:560px;

    position:relative;
}


/* =========================
   CodeMirror
========================= */

.CodeMirror{

    height:100% !important;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size:14px;

    direction:ltr;

    text-align:left;
}

.CodeMirror-hints{

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size:13px;

    z-index:999999;
}

.CodeMirror-hint{

    padding:7px 12px;
}

.CodeMirror-hint-active{

    background:#c7a45b !important;

    color:#0b2239 !important;
}


/* =========================
   Preview
========================= */

.preview-panel{

    background:white;

    border-radius:12px;

    overflow:hidden;

    box-shadow:var(--shadow);

    min-width:0;
}

.preview-header{

    background:
        linear-gradient(
            135deg,
            var(--navy),
            var(--navy2)
        );

    color:white;

    padding:10px 15px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    font-size:13px;

    font-weight:700;
}

.preview-status{

    color:var(--gold2);

    font-size:12px;
}

#preview{

    width:100%;

    height:560px;

    border:none;

    background:white;
}


/* =========================
   المعلومات
========================= */

.bottom-info{

    margin-top:15px;

    background:white;

    border-radius:12px;

    padding:14px 18px;

    box-shadow:
        0 5px 18px rgba(0,0,0,.08);

    display:flex;

    align-items:center;

    justify-content:space-between;

    flex-wrap:wrap;

    gap:10px;

    font-size:13px;
}

.help-text{

    color:#66717c;
}

.shortcut{

    background:var(--cream2);

    padding:5px 9px;

    border-radius:7px;

    font-weight:700;

    color:var(--navy);

    margin-right:4px;

    direction:ltr;

    display:inline-block;
}


/* =========================
   Toast
========================= */

.status-toast{

    position:fixed;

    bottom:25px;

    left:50%;

    transform:
        translateX(-50%)
        translateY(100px);

    background:
        linear-gradient(
            135deg,
            var(--navy),
            var(--navy2)
        );

    color:white;

    padding:13px 22px;

    border-radius:10px;

    box-shadow:var(--shadow);

    opacity:0;

    transition:.3s;

    z-index:99999;

    font-size:14px;

    font-weight:600;

    pointer-events:none;
}

.status-toast.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================
   Responsive
========================= */

@media(max-width:900px){

    header{

        padding:13px 15px;
    }

    .logo-text h1{

    }

    .logo-icon{

        height:45px;

        font-size:23px;
    }

    .toolbar{

        top:71px;
    }

    .workspace{

        grid-template-columns:1fr;
    }

    .editor-wrapper,
    #preview{

        height:450px;
    }

    .editor-tabs{

        overflow-x:auto;
    }

    .editor-tab{

        white-space:nowrap;

        padding:10px 15px;
    }
}


@media(max-width:500px){

    .main-container{

        padding:10px;
    }

    .toolbar{

        gap:5px;

        padding:9px;
    }

    .tool-btn{

        padding:8px 11px;

        font-size:12px;
    }

    .editor-wrapper,
    #preview{

        height:400px;
    }
}

</style>

<!-- =========================
     CodeMirror
========================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>


<!-- Modes -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>


<!-- Editing -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>


<!-- Hints -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/xml-hint.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/css-hint.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/javascript-hint.min.js"></script>


<script>

/* ==========================================================
   المتغيرات
========================================================== */

const editors = {};

let currentLanguage = "html";


/* ==========================================================
   HTML الافتراضي
========================================================== */

const defaultHTML = `<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>صفحتي الجديدة</title>

</head>

<body>

<div class="container">

<h1>مرحباً بك 👋</h1>

<p>
ابدأ بكتابة HTML هنا.
</p>

<button onclick="showMessage()">
اضغط هنا
</button>

</div>

</body>

</html>`;


/* ==========================================================
   CSS الافتراضي
========================================================== */

const defaultCSS = `body {

font-family: Tajawal, sans-serif;

background:#f6f2e9;

color:#0b2239;

margin:0;

padding:40px;

}

.container {

max-width:700px;

margin:auto;

text-align:center;

}

h1 {

color:#19496b;

}

button {

background:#c7a45b;

color:#0b2239;

border:none;

padding:12px 25px;

border-radius:8px;

cursor:pointer;

font-family:inherit;

font-weight:bold;

}`;


/* ==========================================================
   JavaScript الافتراضي
========================================================== */

const defaultJS = `function showMessage() {

alert("مرحباً بك في محرر الأكواد 📚");

}`;


/* ==========================================================
   إنشاء HTML Editor
========================================================== */

editors.html = CodeMirror(
    document.getElementById("htmlEditor"),
    {

        value:defaultHTML,

        mode:"xml",

        theme:"dracula",

        lineNumbers:true,

        lineWrapping:false,

        autoCloseBrackets:true,

        matchBrackets:true,

        indentUnit:4,

        tabSize:4,

        autofocus:true,

        extraKeys:{

            "Ctrl-Space":function(cm){

                openHints(cm);

            },

            "Enter":function(cm){

                CodeMirror.Pass;

                htmlAutoClose(cm);

            }

        }

    }
);


/* ==========================================================
   CSS Editor
========================================================== */

editors.css = CodeMirror(
    document.getElementById("cssEditor"),
    {

        value:defaultCSS,

        mode:"css",

        theme:"dracula",

        lineNumbers:true,

        lineWrapping:false,

        autoCloseBrackets:true,

        matchBrackets:true,

        indentUnit:4,

        tabSize:4,

        extraKeys:{

            "Ctrl-Space":function(cm){

                openHints(cm);

            }

        }

    }
);


/* ==========================================================
   JavaScript Editor
========================================================== */

editors.js = CodeMirror(
    document.getElementById("jsEditor"),
    {

        value:defaultJS,

        mode:"javascript",

        theme:"dracula",

        lineNumbers:true,

        lineWrapping:false,

        autoCloseBrackets:true,

        matchBrackets:true,

        indentUnit:4,

        tabSize:4,

        extraKeys:{

            "Ctrl-Space":function(cm){

                openHints(cm);

            }

        }

    }
);


/* ==========================================================
   قائمة وسوم HTML
========================================================== */

const htmlTags = [

    "html",
    "head",
    "body",
    "title",
    "meta",
    "link",
    "style",
    "script",

    "header",
    "nav",
    "main",
    "section",
    "article",
    "aside",
    "footer",

    "div",
    "span",

    "h1",
    "h2",
    "h3",
    "h4",
    "h5",
    "h6",

    "p",

    "a",

    "img",

    "picture",
    "source",

    "ul",
    "ol",
    "li",

    "table",
    "thead",
    "tbody",
    "tfoot",
    "tr",
    "th",
    "td",

    "form",
    "label",
    "input",
    "textarea",
    "select",
    "option",
    "button",

    "video",
    "audio",
    "iframe",

    "canvas",

    "br",
    "hr",

    "strong",
    "b",
    "em",
    "i",
    "u",
    "small",
    "mark",

    "details",
    "summary",

    "figure",
    "figcaption"
];


/* ==========================================================
   الوسوم التي لا تحتاج إغلاق
========================================================== */

const voidTags = new Set([

    "area",
    "base",
    "br",
    "col",
    "embed",
    "hr",
    "img",
    "input",
    "link",
    "meta",
    "param",
    "source",
    "track",
    "wbr"

]);


/* ==========================================================
   اقتراحات HTML مخصصة
========================================================== */

function htmlHint(cm){

    const cursor =
        cm.getCursor();

    const line =
        cm.getLine(cursor.line);

    const before =
        line.substring(
            0,
            cursor.ch
        );


    const match =
        before.match(
            /<([a-zA-Z0-9-]*)$/
        );


    if(!match){

        return CodeMirror.hint.xml(cm);

    }


    const typed =
        match[1].toLowerCase();


    const start =
        cursor.ch - typed.length;


    const list =
        htmlTags
            .filter(
                tag =>
                    tag.startsWith(typed)
            )
            .map(
                tag => ({
                    text:tag,
                    display:
                        "<" + tag + ">"
                })
            );


    return {

        list:list,

        from:CodeMirror.Pos(
            cursor.line,
            start
        ),

        to:CodeMirror.Pos(
            cursor.line,
            cursor.ch
        )

    };

}


/* ==========================================================
   CSS / JS / HTML Hints
========================================================== */

function openHints(cm){

    const mode =
        cm.getMode().name;


    if(
        mode === "xml" ||
        mode === "htmlmixed"
    ){

        CodeMirror.showHint(
            cm,
            htmlHint,
            {
                completeSingle:false
            }
        );

        return;

    }


    if(mode === "css"){

        CodeMirror.showHint(
            cm,
            CodeMirror.hint.css,
            {
                completeSingle:false
            }
        );

        return;

    }


    if(mode === "javascript"){

        CodeMirror.showHint(
            cm,
            CodeMirror.hint.javascript,
            {
                completeSingle:false
            }
        );

    }

}


/* ==========================================================
   إغلاق HTML تلقائيًا
========================================================== */

function htmlAutoClose(cm){

    const cursor =
        cm.getCursor();

    const line =
        cm.getLine(cursor.line);


    /*
       نبحث عن آخر وسم مفتوح
       مثل:

       <div>

       <section class="box">

       <h1>
    */

    const match =
        line
            .substring(
                0,
                cursor.ch
            )
            .match(
                /<([a-zA-Z][\w:-]*)(?:\s[^<>]*)?>$/
            );


    if(!match){

        CodeMirror.Pass;

        return;

    }


    const tagName =
        match[1].toLowerCase();


    /* لا نغلق الوسوم الذاتية */

    if(voidTags.has(tagName)){

        CodeMirror.Pass;

        return;

    }


    const closingTag =
        "</" +
        tagName +
        ">";


    /*
       نضع وسم الإغلاق بعد المؤشر
    */

    cm.replaceRange(
        closingTag,
        cursor,
        cursor
    );


    /*
       يبقى المؤشر داخل الوسم
    */

    cm.setCursor(
        cursor
    );

}


/* ==========================================================
   معالجة الكتابة داخل HTML
========================================================== */

editors.html.on(
    "beforeChange",
    function(cm, change){

        /*
           لا نتدخل في اللصق
           أو العمليات البرمجية
        */

        if(
            change.origin !== "+input"
        ){

            return;

        }

    }
);


/* ==========================================================
   فتح الاقتراحات عند كتابة <
========================================================== */

editors.html.on(
    "inputRead",
    function(cm, change){

        if(
            !change.text ||
            change.origin === "complete"
        ){

            return;

        }


        const text =
            change.text.join("");


        if(
            text === "<" ||
            /^[a-zA-Z]$/.test(text)
        ){

            setTimeout(
                function(){

                    if(cm.hasFocus()){

                        openHints(cm);

                    }

                },
                80
            );

        }

    }
);


/* ==========================================================
   CSS autocomplete
========================================================== */

editors.css.on(
    "inputRead",
    function(cm, change){

        if(
            !change.text ||
            change.origin === "complete"
        ){

            return;

        }


        const text =
            change.text.join("");


        if(
            /^[a-zA-Z-]$/.test(text)
        ){

            setTimeout(
                function(){

                    if(cm.hasFocus()){

                        openHints(cm);

                    }

                },
                100
            );

        }

    }
);


/* ==========================================================
   JavaScript autocomplete
========================================================== */

editors.js.on(
    "inputRead",
    function(cm, change){

        if(
            !change.text ||
            change.origin === "complete"
        ){

            return;

        }


        const text =
            change.text.join("");


        if(
            /^[a-zA-Z_$]$/.test(text) ||
            text === "."
        ){

            setTimeout(
                function(){

                    if(cm.hasFocus()){

                        openHints(cm);

                    }

                },
                100
            );

        }

    }
);


/* ==========================================================
   تبديل المحررات
========================================================== */

function showEditor(type){

    currentLanguage =
        type;


    document
        .querySelectorAll(".code-area")
        .forEach(
            function(area){

                area.style.display =
                    "none";

            }
        );


    document.getElementById(
        type + "Editor"
    ).style.display =
        "block";


    document
        .querySelectorAll(".editor-tab")
        .forEach(
            function(tab){

                tab.classList.remove(
                    "active"
                );

            }
        );


    const activeTab =
        document.querySelector(
            '[data-editor="' +
            type +
            '"]'
        );


    if(activeTab){

        activeTab.classList.add(
            "active"
        );

    }


    const titles = {

        html:"محرر HTML",

        css:"محرر CSS",

        js:"محرر JavaScript"

    };


    const labels = {

        html:"HTML",

        css:"CSS",

        js:"JavaScript"

    };


    document.getElementById(
        "editorTitle"
    ).textContent =
        titles[type];


    document.getElementById(
        "languageLabel"
    ).textContent =
        labels[type];


    setTimeout(
        function(){

            editors[type].refresh();

            editors[type].focus();

        },
        30
    );

}


/* ==========================================================
   بناء HTML النهائي
========================================================== */

function buildHTML(){

    let html =
        editors.html.getValue();

    const css =
        editors.css.getValue();

    const js =
        editors.js.getValue();


    if(css.trim()){

        const style =
`<style>
${css}
</style>`;


        if(
            /<\/head>/i.test(html)
        ){

            html =
                html.replace(
                    /<\/head>/i,
                    style +
                    "\n</head>"
                );

        }else{

            html =
                style +
                "\n" +
                html;

        }

    }


    if(js.trim()){

        const script =
`<script>
${js}
<\/script>`;


        if(
            /<\/body>/i.test(html)
        ){

            html =
                html.replace(
                    /<\/body>/i,
                    script +
                    "\n</body>"
                );

        }else{

            html +=
                "\n" +
                script;

        }

    }


    return html;

}


/* ==========================================================
   تشغيل
========================================================== */

function runCode(){

    const preview =
        document.getElementById(
            "preview"
        );


    try{

        preview.srcdoc =
            buildHTML();


        document.getElementById(
            "previewStatus"
        ).textContent =
            "تم التشغيل ✓";


        showStatus(
            "تم تشغيل الكود بنجاح ▶️"
        );

    }catch(error){

        console.error(error);

        showStatus(
            "حدث خطأ أثناء تشغيل الكود"
        );

    }

}


/* ==========================================================
   حفظ
========================================================== */

function saveProject(){

    const project = {

        html:
            editors.html.getValue(),

        css:
            editors.css.getValue(),

        js:
            editors.js.getValue()

    };


    localStorage.setItem(
        "webEditorProject",
        JSON.stringify(project)
    );


    showStatus(
        "تم حفظ المشروع بنجاح 💾"
    );

}


/* ==========================================================
   استرجاع
========================================================== */

function loadProject(){

    const saved =
        localStorage.getItem(
            "webEditorProject"
        );


    if(!saved){

        showStatus(
            "لا يوجد مشروع محفوظ"
        );

        return;

    }


    try{

        const project =
            JSON.parse(saved);


        editors.html.setValue(
            project.html || ""
        );

        editors.css.setValue(
            project.css || ""
        );

        editors.js.setValue(
            project.js || ""
        );


        editors.html.refresh();

        editors.css.refresh();

        editors.js.refresh();


        runCode();


        showStatus(
            "تم استرجاع المشروع بنجاح 📂"
        );

    }catch(error){

        console.error(error);

        showStatus(
            "تعذر استرجاع المشروع"
        );

    }

}

   حفظ تلقائي

setInterval(
    function(){

        const project = {

        };


        localStorage.setItem(

        );

/* ==========================================================
   تنزيل
========================================================== */

function downloadHTML(){

    const content =
        buildHTML();


    const blob =
        new Blob(
            [content],
            {
                type:
                    "text/html;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href =
        url;

    link.download =
        "my-web-page.html";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    URL.revokeObjectURL(
        url
    );


    showStatus(
        "تم تنزيل ملف HTML ⬇️"
    );

}


/* ==========================================================
   مسح
========================================================== */

function clearProject(){

    const confirmed =
        confirm(
            "هل أنت متأكد من مسح جميع الأكواد؟"
        );


    if(!confirmed){

        return;

    }


    editors.html.setValue("");

    editors.css.setValue("");

    editors.js.setValue("");


    document.getElementById(
        "preview"
    ).srcdoc = "";


    localStorage.removeItem(
        "webEditorProject"
    );


    localStorage.removeItem(
        "webEditorAutoSave"
    );


    document.getElementById(
        "previewStatus"
    ).textContent =
        "فارغ";


    showStatus(
        "تم مسح جميع الأكواد 🗑️"
    );

}

   الرسائل
========================================================== */

let statusTimer;


function showStatus(message){

    const toast =
        document.getElementById(
            "statusToast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        statusTimer
    );


    statusTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}
