<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>محرر الأكواد من مكتبة عامودا الرقمية</title>

<!-- Tajawal -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">

<!-- CodeMirror -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

<style>

:root {
    --navy: #001D3D;
    --navy2: #002855;
    --blue: #003566;
    --gold: #D4AF37;
    --gold-light: #E8D18A;
    --white: #ffffff;
    --bg: #f4f6f8;
    --border: #d8dee5;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family: "Tajawal", sans-serif;
    background: var(--bg);
    color: #222;
    overflow: hidden;
}

/* ================= HEADER ================= */

header {
    height: 70px;
    background: linear-gradient(135deg, var(--navy), var(--navy2));
    color: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;

    box-shadow: 0 2px 10px rgba(0,0,0,.2);

    position: relative;
    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-icon {
    width: 42px;
    height: 42px;

    border-radius: 10px;

    background: linear-gradient(
        135deg,
        var(--gold),
        var(--gold-light)
    );

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 23px;

    box-shadow: 0 3px 10px rgba(0,0,0,.25);
}

.logo-text {
    display: flex;
    flex-direction: column;
}

.logo-title {
    font-size: 18px;
    font-weight: 800;
}

.logo-subtitle {
    font-size: 11px;
    color: #dbe6f1;
    margin-top: 2px;
}

/* ================= TOOLBAR ================= */

.toolbar {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
}

.toolbar button {
    font-family: "Tajawal", sans-serif;

    border: 1px solid rgba(255,255,255,.15);

    background: rgba(255,255,255,.08);

    color: white;

    padding: 8px 13px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 13px;

    transition: .2s;
}

.toolbar button:hover {
    background: var(--gold);
    color: #111;
    border-color: var(--gold);
}

.toolbar button:active {
    transform: scale(.96);
}

/* ================= TABS ================= */

.tabs {
    height: 48px;

    background: #ffffff;

    border-bottom: 1px solid var(--border);

    display: flex;
    align-items: center;

    padding: 0 12px;

    gap: 5px;

    position: relative;
    z-index: 90;
}

.tab {
    height: 36px;

    padding: 0 18px;

    border: none;

    background: transparent;

    font-family: "Tajawal", sans-serif;

    font-size: 14px;

    cursor: pointer;

    border-radius: 6px;

    color: #555;

    user-select: none;

    transition: .2s;
}

.tab:hover {
    background: #eef2f5;
}

.tab.active {
    background: var(--navy);
    color: white;
}

/* ================= MAIN EDITOR ================= */

.editor-container {

    height: calc(100vh - 118px);

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 1px;

    background: #cfd5da;

    transition: height .25s ease;
}

.editor-panel,
.preview-panel {

    min-width: 0;

    min-height: 0;

    background: white;

    display: flex;

    flex-direction: column;
}

/* ================= EDITOR ================= */

.panel-title {

    height: 42px;

    background: var(--navy2);

    color: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 13px;

    font-size: 13px;

    font-weight: 700;
}

.panel-title span {
    color: var(--gold-light);
}

.code-area {

    flex: 1;

    min-height: 0;

    pointer-events: auto;

    position: relative;

    z-index: 2;
}

/* ================= CODEMIRROR ================= */

.CodeMirror {

    height: 100% !important;

    width: 100%;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 14px;

    direction: ltr;

    text-align: left;

    pointer-events: auto;

    cursor: text;

    position: relative;

    z-index: 10;
}

.CodeMirror-scroll {

    overflow: auto !important;

    cursor: text;
}

.CodeMirror textarea {
    font-family:
        Consolas,
        "Courier New",
        monospace !important;
}

/* ================= PREVIEW ================= */

.preview-frame {

    flex: 1;

    border: none;

    width: 100%;

    background: white;
}

/* ================= STATUS ================= */

.status {

    position: fixed;

    bottom: 18px;

    left: 50%;

    transform: translateX(-50%) translateY(80px);

    background: var(--navy);

    color: white;

    padding: 10px 18px;

    border-radius: 8px;

    font-size: 13px;

    box-shadow: 0 5px 20px rgba(0,0,0,.25);

    opacity: 0;

    transition: .3s;

    z-index: 9999;

    pointer-events: none;
}

.status.show {

    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* ================= FULLSCREEN MODE ================= */

/*
   هذا ليس Fullscreen للمتصفح نفسه.
   إنه وضع ملء الشاشة داخل الصفحة.
*/

body.fullscreen-mode header,
body.fullscreen-mode .tabs {

    display: none;
}

body.fullscreen-mode .editor-container {

    height: 100vh;
}

/* عند ملء الشاشة نكبر عنوان اللوحة قليلاً */

body.fullscreen-mode .panel-title {

    height: 44px;
}

/* ================= MOBILE ================= */

@media (max-width: 800px) {

    body {
        overflow: auto;
    }

    header {

        height: auto;

        min-height: 70px;

        padding: 10px;

        gap: 10px;

        flex-direction: column;

        align-items: stretch;
    }

    .logo {

        justify-content: center;
    }

    .toolbar {

        justify-content: center;
    }

    .toolbar button {

        padding: 7px 10px;

        font-size: 12px;
    }

    .tabs {

        overflow-x: auto;

        white-space: nowrap;
    }

    .editor-container {

        height: calc(100vh - 118px);

        grid-template-columns: 1fr;

        grid-template-rows: 1fr 1fr;
    }

    body.fullscreen-mode .editor-container {

        height: 100vh;

        grid-template-rows: 1fr 1fr;
    }
}

@media (max-width: 500px) {

    .logo-title {
        font-size: 15px;
    }

    .logo-subtitle {
        font-size: 10px;
    }

    .toolbar button {

        padding: 6px 8px;

        font-size: 11px;
    }

    .tab {

        padding: 0 13px;

        font-size: 13px;
    }
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="logo">

        <div class="logo-icon">
            📚
        </div>

        <div class="logo-text">

            <div class="logo-title">
                محرر الأكواد من مكتبة عامودا الرقمية
            </div>

            <div class="logo-subtitle">
                HTML • CSS • JavaScript
            </div>

        </div>

    </div>


    <div class="toolbar">

        <button onclick="runCode()">
            ▶️ تشغيل
        </button>

        <button onclick="saveProject()">
            💾 حفظ
        </button>

        <button onclick="loadProject()">
            📂 تحميل
        </button>

        <button onclick="downloadHTML()">
            ⬇️ تنزيل
        </button>

        <button onclick="clearProject()">
            🗑️ مسح
        </button>

        <!-- زر ملء الشاشة -->

        <button
            id="fullscreenBtn"
            onclick="toggleFullscreen()">

            ⛶ ملء الشاشة

        </button>

    </div>

</header>


<!-- ================= TABS ================= -->

<div class="tabs">

    <button
        class="tab active"
        data-editor="html"
        onclick="showEditor('html')">

        HTML

    </button>

    <button
        class="tab"
        data-editor="css"
        onclick="showEditor('css')">

        CSS

    </button>

    <button
        class="tab"
        data-editor="js"
        onclick="showEditor('js')">

        JavaScript

    </button>

</div>


<!-- ================= MAIN ================= -->

<div class="editor-container">

    <!-- EDITOR -->

    <section class="editor-panel">

        <div class="panel-title">

            <span>
                💻 محرر الأكواد
            </span>

            <span id="currentLanguage">
                HTML
            </span>

        </div>

        <div
            id="htmlEditor"
            class="code-area">
        </div>

        <div
            id="cssEditor"
            class="code-area"
            style="display:none;">
        </div>

        <div
            id="jsEditor"
            class="code-area"
            style="display:none;">
        </div>

    </section>


    <!-- PREVIEW -->

    <section class="preview-panel">

        <div class="panel-title">

            <span>
                👁️ المعاينة
            </span>

            <span>
                Live Preview
            </span>

        </div>

        <iframe
            id="preview"
            class="preview-frame"
            sandbox="allow-scripts allow-forms allow-modals allow-popups">
        </iframe>

    </section>

</div>


<!-- ================= STATUS ================= -->

<div
    id="status"
    class="status">
</div>


<!-- ================= CODEMIRROR ================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>


<script>

/* =====================================================
   DEFAULT CODE
===================================================== */

const defaultHTML = `<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>صفحتي</title>

</head>

<body>

<h1>مرحباً بك 👋</h1>

<p>
هذه صفحة تجريبية من محرر الأكواد.
</p>

<button onclick="sayHello()">
اضغط هنا
</button>

</body>

</html>`;


const defaultCSS = `body {

    font-family: Tajawal, sans-serif;

    background: #f4f6f8;

    color: #001D3D;

    text-align: center;

    padding: 50px;

}

h1 {

    color: #001D3D;

}

button {

    background: #001D3D;

    color: white;

    border: none;

    padding: 12px 25px;

    border-radius: 8px;

    cursor: pointer;

    font-family: Tajawal, sans-serif;

}

button:hover {

    background: #D4AF37;

    color: #111;

}`;


const defaultJS = `function sayHello() {

    alert("مرحباً بك في محرر الأكواد!");

}`;


/* =====================================================
   EDITORS
===================================================== */

const editors = {};


/* HTML */

editors.html = CodeMirror(
    document.getElementById("htmlEditor"),
    {

        value: defaultHTML,

        mode: "xml",

        theme: "dracula",

        lineNumbers: true,

        lineWrapping: false,

        autoCloseTags: true,

        autoCloseBrackets: true,

        matchBrackets: true,

        indentUnit: 4,

        tabSize: 4,

        autofocus: true

    }
);


/* CSS */

editors.css = CodeMirror(
    document.getElementById("cssEditor"),
    {

        value: defaultCSS,

        mode: "css",

        theme: "dracula",

        lineNumbers: true,

        lineWrapping: false,

        autoCloseBrackets: true,

        matchBrackets: true,

        indentUnit: 4,

        tabSize: 4

    }
);


/* JavaScript */

editors.js = CodeMirror(
    document.getElementById("jsEditor"),
    {

        value: defaultJS,

        mode: "javascript",

        theme: "dracula",

        lineNumbers: true,

        lineWrapping: false,

        autoCloseBrackets: true,

        matchBrackets: true,

        indentUnit: 4,

        tabSize: 4

    }
);


/* =====================================================
   SHOW EDITOR
===================================================== */

function showEditor(type) {

    document
        .querySelectorAll(".code-area")
        .forEach(area => {

            area.style.display = "none";

        });


    document.getElementById(
        type + "Editor"
    ).style.display = "block";


    document
        .querySelectorAll(".tab")
        .forEach(tab => {

            tab.classList.remove("active");

        });


    const activeTab =
        document.querySelector(
            `.tab[data-editor="${type}"]`
        );


    if (activeTab) {

        activeTab.classList.add("active");

    }


    const names = {

        html: "HTML",

        css: "CSS",

        js: "JavaScript"

    };


    document.getElementById(
        "currentLanguage"
    ).textContent = names[type];


    /*
       تحديث CodeMirror بعد إظهار المحرر
       حتى لا تختفي الكتابة أو المؤشر.
    */

    setTimeout(() => {

        editors[type].refresh();

        editors[type].focus();

    }, 20);

}


/* =====================================================
   BUILD FULL HTML
===================================================== */

function buildHTML() {

    let html =
        editors.html.getValue();

    const css =
        editors.css.getValue();

    const js =
        editors.js.getValue();


    /* إضافة CSS */

    if (css.trim()) {

        if (html.includes("</head>")) {

            html = html.replace(
                "</head>",
                `<style>
${css}
</style>
</head>`
            );

        } else {

            html =
                `<style>
${css}
</style>
` + html;

        }

    }


    /* إضافة JavaScript */

    if (js.trim()) {

        if (html.includes("</body>")) {

            html = html.replace(
                "</body>",
                `<script>
${js}
<\/script>
</body>`
            );

        } else {

            html +=
                `<script>
${js}
<\/script>`;

        }

    }


    return html;
}


/* =====================================================
   RUN CODE
===================================================== */

function runCode() {

    const preview =
        document.getElementById("preview");


    preview.srcdoc =
        buildHTML();


    showStatus(
        "تم تشغيل الكود بنجاح ▶️"
    );

}


/* =====================================================
   SAVE PROJECT
===================================================== */

function saveProject() {

    const project = {

        html:
            editors.html.getValue(),

        css:
            editors.css.getValue(),

        js:
            editors.js.getValue()

    };


    localStorage.setItem(
        "webEditorProject",
        JSON.stringify(project)
    );


    showStatus(
        "تم حفظ المشروع بنجاح 💾"
    );

}


/* =====================================================
   LOAD PROJECT
===================================================== */

function loadProject() {

    const saved =
        localStorage.getItem(
            "webEditorProject"
        );


    if (!saved) {

        showStatus(
            "لا يوجد مشروع محفوظ 📂"
        );

        return;

    }


    try {

        const project =
            JSON.parse(saved);


        editors.html.setValue(
            project.html || ""
        );

        editors.css.setValue(
            project.css || ""
        );

        editors.js.setValue(
            project.js || ""
        );


        runCode();


        showStatus(
            "تم تحميل المشروع بنجاح 📂"
        );


    } catch (error) {

        showStatus(
            "حدث خطأ أثناء تحميل المشروع"
        );

    }

}


/* =====================================================
   AUTO SAVE
===================================================== */

setInterval(() => {

    const project = {

        html:
            editors.html.getValue(),

        css:
            editors.css.getValue(),

        js:
            editors.js.getValue()

    };


    localStorage.setItem(
        "webEditorAutoSave",
        JSON.stringify(project)
    );

}, 5000);


/* =====================================================
   DOWNLOAD HTML
===================================================== */

function downloadHTML() {

    const content =
        buildHTML();


    const blob =
        new Blob(
            [content],
            {
                type: "text/html;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;

    link.download =
        "my-web-page.html";


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);


    showStatus(
        "تم تنزيل ملف HTML ⬇️"
    );

}


/* =====================================================
   CLEAR
===================================================== */

function clearProject() {

    const confirmed =
        confirm(
            "هل تريد مسح جميع الأكواد؟"
        );


    if (!confirmed) {

        return;

    }


    editors.html.setValue(
        defaultHTML
    );

    editors.css.setValue(
        defaultCSS
    );

    editors.js.setValue(
        defaultJS
    );


    runCode();


    showStatus(
        "تمت إعادة الأكواد الافتراضية 🗑️"
    );

}


/* =====================================================
   STATUS
===================================================== */

let statusTimer;


function showStatus(message) {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    status.classList.add(
        "show"
    );


    clearTimeout(
        statusTimer
    );


    statusTimer =
        setTimeout(() => {

            status.classList.remove(
                "show"
            );

        }, 2500);

}


/* =====================================================
   FULLSCREEN TOGGLE
===================================================== */

function toggleFullscreen() {

    const body =
        document.body;

    const button =
        document.getElementById(
            "fullscreenBtn"
        );


    const isFullscreen =
        body.classList.contains(
            "fullscreen-mode"
        );


    if (!isFullscreen) {

        /*
           دخول وضع ملء الشاشة
        */

        body.classList.add(
            "fullscreen-mode"
        );


        button.innerHTML =
            "↙️ خروج من ملء الشاشة";


        showStatus(
            "تم الدخول إلى ملء الشاشة ⛶"
        );


    } else {

        /*
           الخروج من وضع ملء الشاشة
        */

        exitFullscreenMode();

    }


    refreshAllEditors();

}


/* =====================================================
   EXIT FULLSCREEN
===================================================== */

function exitFullscreenMode() {

    document.body.classList.remove(
        "fullscreen-mode"
    );


    const button =
        document.getElementById(
            "fullscreenBtn"
        );


    button.innerHTML =
        "⛶ ملء الشاشة";


    showStatus(
        "تم الخروج من ملء الشاشة ↙️"
    );


    refreshAllEditors();

}


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" &&
            document.body.classList.contains(
                "fullscreen-mode"
            )
        ) {

            exitFullscreenMode();

        }

    }
);


/* =====================================================
   REFRESH EDITORS
===================================================== */

function refreshAllEditors() {

    setTimeout(() => {

        Object.keys(editors)
            .forEach(key => {

                editors[key].refresh();

            });

    }, 100);

}


/* =====================================================
   KEYBOARD SHORTCUTS
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        /*
           Ctrl + S
        */

        if (
            (event.ctrlKey || event.metaKey) &&
            event.key.toLowerCase() === "s"
        ) {

            event.preventDefault();

            saveProject();

        }


        /*
           Ctrl + Enter
        */

        if (
            (event.ctrlKey || event.metaKey) &&
            event.key === "Enter"
        ) {

            event.preventDefault();

            runCode();

        }

    }
);


/* =====================================================
   WINDOW RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function() {

        refreshAllEditors();

    }
);


/* =====================================================
   INITIAL RUN
===================================================== */

runCode();

</script>

</body>
</html>
```
